capabilities:
  - id: home.brand_update_check
    purpose: 사용자가 홈의 S.tand 로고를 눌러 설치된 앱이 최신인지 바로 확인한다.
    source_refs:
      - STand/UI/RootView.swift
      - STand/Services/MacUpdaterController.swift
    entry_points: [홈 > S.tand 로고]
    preconditions: [인터넷에 연결되어 있음]
    inputs: [로고 선택]
    normal_result: 확인 중 상태 뒤 최신, 새 버전, 또는 다시 시도할 수 있는 오류 안내를 표시한다.
    states: [checking, latest, update_available, failed]
    algorithms_and_thresholds:
      - 숫자 빌드 번호만 비교하며 원격 빌드가 현재 빌드보다 클 때만 새 버전으로 판정한다.
    data_contracts:
      - Apple 모바일은 NasFinder TestFlight 빌드 API의 stand 항목을 사용한다.
      - Mac은 기존 Sparkle 앱캐스트를 사용한다.
      - Android는 GitHub Releases의 최신 릴리스와 APK 자산을 사용한다.
    producer_consumer_routes: [공개 릴리스 정보 > 버전 비교 > 홈 안내]
    persistence_relaunch: 확인 결과를 저장하지 않고 누를 때마다 최신 공개 정보를 다시 확인한다.
    permissions_privacy_security: [버전 확인 외 개인정보를 전송하지 않는다.]
    background_lifecycle: 화면을 떠나면 진행 중인 모바일 요청을 취소한다.
    gestures_accessibility:
      - 로고의 접근성 이름은 최신 버전 확인이다.
      - Google TV에서는 D-pad 포커스와 선택으로 실행한다.
    supported_devices_layouts: [iPhone, iPad, Mac, Android phone, Android tablet, Google TV]
    visual_reference: .parity/evidence/2026-08-25/google-tv-logo-update-latest.png
    platform_adaptations:
      apple: [iPhone과 iPad는 TestFlight를 열고 Mac은 Sparkle 업데이트 화면을 연다.]
      android: [GitHub Release의 APK 다운로드 화면을 연다.]
    intentional_differences:
      - platform: all
        device_layout: all
        contract_field: update_distribution
        reason: 플랫폼별 공식 배포 경로가 다르다.
        closest_equivalent: 같은 로고 조작과 같은 네 가지 결과 상태를 제공한다.
        review_trigger: 배포 경로가 변경될 때
    implementations:
      apple:
        status: implemented
        source_refs: [STand/UI/RootView.swift, STand/Services/MacUpdaterController.swift]
        tests: [STandTests/MacUpdaterControllerTests.swift]
        evidence: [199 unit tests passed, STand UI catalog passed]
      android:
        status: implemented
        source_refs:
          - app/src/main/java/com/armsone/stand/ui/StandHomeScreen.kt
          - app/src/main/java/com/armsone/stand/update/GitHubAppUpdateService.kt
        tests:
          - app/src/test/java/com/armsone/stand/update/GitHubUpdatePolicyTest.kt
          - app/src/androidTest/java/com/armsone/stand/ui/AppUpdateDialogTest.kt
        evidence:
          - .parity/evidence/2026-08-25/logo-update-check-behavior-trace.md
          - .parity/evidence/2026-08-25/google-tv-logo-update-latest.png
    dependencies: [NasFinder TestFlight API, Sparkle appcast, GitHub Releases API]
    parity_row_ids: [home.brand_update_check]
  - id: settings.music.six_slot_management
    purpose: 사용자가 홈의 여섯 음악 채널을 한 목록에서 재생·수정·정렬한다.
    source_refs:
      - STand/UI/SettingsView.swift
      - STand/Models/AppSettings.swift
    entry_points: [설정 > 인터넷 라디오 바로가기, 설정 > 음악]
    preconditions: [앱 설정 화면을 열 수 있음]
    inputs: [음악 서비스 선택, 라디오 재생, 라디오 수정, 순서 변경]
    normal_result: 상단 바로가기가 음악 카드로 이동하며, 여섯 행의 순서와 상태가 홈 음악 스트립에 그대로 반영되고 재실행 뒤에도 유지된다.
    states: [idle, playing, loading, reconnecting, failed, empty]
    algorithms_and_thresholds:
      - 음악 서비스 2개와 인터넷 라디오 슬롯 4개를 합쳐 항상 6개 행으로 정규화한다.
      - 이미 배치된 행을 다른 위치로 옮기면 두 위치를 교환한다.
    data_contracts:
      - homeMusicChannels는 고유한 음악 서비스와 안정적인 radioSlot을 가진다.
    producer_consumer_routes:
      - 설정 음악 목록 > AppSettings.homeMusicChannels > 홈 음악 스트립
    persistence_relaunch: 저장소에 채널 순서를 기록하고 재실행 때 정규화해 복원한다.
    permissions_privacy_security:
      - 라디오 주소는 사용자가 직접 입력하며 앱이 웹페이지에서 자동 추출하지 않는다.
    background_lifecycle: 외부 음악 또는 라디오 재생 중에는 소리 감지와 녹음을 잠시 멈춘다.
    gestures_accessibility:
      - 터치 환경에서는 행의 순서 손잡이를 사용한다.
      - 키보드와 TV 리모컨에서는 순서 손잡이 선택 후 위·아래 버튼으로 이동한다.
    supported_devices_layouts: [iPhone, iPad, Mac, Android phone, Android tablet, Google TV]
    visual_reference: /Users/armsone/Library/Containers/cc.ffitch.shottr/Data/tmp/cc.ffitch.shottr/SCR-20260825-iqvy.png
    platform_adaptations:
      apple:
        - Apple Music과 Apple Music Classical을 기본 음악 서비스로 사용한다.
      android:
        - Spotify와 YouTube Music을 기본 음악 서비스로 사용한다.
        - D-pad에서 손잡이를 선택하면 명시적인 위·아래·완료 조작을 표시한다.
    intentional_differences:
      - platform: android
        device_layout: all
        contract_field: service_identity
        reason: Apple MusicKit 서비스 대신 Android에서 실제로 열 수 있는 Spotify와 YouTube Music을 사용한다.
        closest_equivalent: 음악 서비스 두 개와 라디오 네 개로 같은 여섯 슬롯 결과를 제공한다.
        review_trigger: Android에서 Apple Music 직접 재생 계약을 공식 지원할 때
    implementations:
      apple:
        status: implemented
        source_refs: [STand/UI/SettingsView.swift]
        tests: []
        evidence:
          - SCR-20260825-iqvy.png sha256:1c8c0a52b14d867fde1b690ca408e140f61549100323d8e896de5fef52e47f29
      android:
        status: implemented
        source_refs:
          - app/src/main/java/com/armsone/stand/ui/SettingsScreen.kt
          - app/src/main/java/com/armsone/stand/model/ExternalMusicService.kt
        tests: [app/src/test/java/com/armsone/stand/model/HomeMusicChannelPolicyTest.kt]
        evidence:
          - .parity/evidence/2026-08-25/google-tv-settings-music.png
    dependencies: [AppSettings.homeMusicChannels, InternetRadioState, ExternalMusicService]
    parity_row_ids: [settings.music.six_slot_management]
  - id: settings.layout.responsive_independent_columns
    purpose: 서로 높이가 다른 설정 카드가 가로·태블릿·TV 화면에서 큰 빈칸 없이 읽기 순서대로 흐른다.
    source_refs:
      - STand/UI/SettingsView.swift
    entry_points: [설정]
    preconditions: [넓은 화면 또는 가로 화면]
    inputs: [창 크기, 기기 방향]
    normal_result: 좁은 화면은 한 열, 720dp 이상은 독립적인 두 열이며 음악 카드는 전체 폭을 사용한다.
    states: [narrow, wide]
    algorithms_and_thresholds: [Android의 넓은 화면 기준은 720dp이다.]
    data_contracts: []
    producer_consumer_routes: [창 너비 > 설정 카드 배치]
    persistence_relaunch: 배치는 창 크기로 다시 계산하며 설정 상태는 유지한다.
    permissions_privacy_security: []
    background_lifecycle: 해당 없음
    gestures_accessibility: D-pad 포커스는 화면에 보이는 카드와 조작 순서를 따라 이동한다.
    supported_devices_layouts: [portrait phone, landscape phone, tablet, Google TV]
    visual_reference: settings music landscape captures
    platform_adaptations:
      apple: [명시적인 두 개의 독립 VStack을 사용한다.]
      android: [LazyVerticalStaggeredGrid의 독립 lane과 MUSIC FullLine을 사용한다.]
    intentional_differences: []
    implementations:
