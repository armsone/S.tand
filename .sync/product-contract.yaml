capabilities:
  - id: mate_mode.overnight_reliability_and_status
    purpose: 화면을 끄거나 앱을 벗어나도 매이트의 소리 감시를 이어가고, 조용한 밤과 감시 실패를 사용자가 구분한다.
    source_refs:
      - STand/UI/StandViewModel.swift
      - STand/Services/RecordingLibrary.swift
      - STand/UI/RootView.swift
      - STand/UI/RecordingsView.swift
    entry_points: [활성 세션 > 화면 잠금 또는 앱 전환, 홈 상단 상태, 수면 소리 기록]
    preconditions: [활성 세션, 백그라운드 감시 켜짐, 마이크 권한, 매이트 모드 또는 자동 모드]
    inputs: [앱 비활성 전환, 화면 잠금, 오디오 캡처 상태, 마이크 권한, 감시 중단 사유]
    normal_result: 자동 모드는 매이트로 확정되고 같은 세션의 마이크 감시가 이어지며, 아침에 정상 감시된 소리 0개와 감시 실패를 서로 다른 문구로 표시한다.
    states: [inactive, learning, monitoring, saving, permission_required, suspended, failed]
    algorithms_and_thresholds:
      - 자동 모드는 백그라운드 전환 직전에 카메라 판정 없이 매이트로 확정한다.
      - 백그라운드 감시 기본값은 켜짐이며 기존 설치에는 한 번 적용하고 이후 사용자 선택은 유지한다.
      - 실제 오디오 캡처가 monitoring 상태에 도달한 세션만 정상 감시된 조용한 밤으로 판정한다.
    data_contracts:
      - 세션은 감시 확인 상태를 이전 기록과 호환되는 형태로 저장한다.
      - 소리와 녹음 파일은 계속 기기 안에만 저장한다.
    producer_consumer_routes: [오디오 캡처 상태 > 세션 감시 확인 > 홈 상태와 수면 기록 문구]
    persistence_relaunch: 백그라운드 설정과 감시 확인 세션 메타데이터를 저장하고 재실행 때 복원한다.
    permissions_privacy_security: [마이크 권한이 없으면 감시하지 않고 권한 필요 상태를 표시한다., 원음과 녹음은 자동 전송하지 않는다.]
    background_lifecycle: 자격이 있는 매이트 세션은 화면 잠금과 앱 전환에도 유지하며, 자격이 사라질 때만 캡처와 세션을 닫는다.
    gestures_accessibility:
      - 홈 상태 이름과 실제 감시 상태를 하나의 접근성 설명으로 읽는다.
    supported_devices_layouts: [iPhone, iPad, Android phone, Android tablet]
    visual_reference: none
    platform_adaptations:
      apple: [UIBackgroundModes audio와 AVAudioSession record를 사용하고 전면 권한이 남아 있을 때 자동 매이트 오디오를 시작한다.]
      android: [microphone foreground service와 ongoing notification, partial wake lock을 사용한다.]
    intentional_differences: []
    implementations:
      apple:
        status: implemented
        source_refs: [STand/UI/StandViewModel.swift, STand/Services/RecordingLibrary.swift, STand/UI/RootView.swift, STand/UI/RecordingsView.swift]
        tests: [STandTests/OvernightReliabilityTests.swift]
        evidence: [233 STand unit tests passed]
      android:
        status: implemented
        source_refs: [app/src/main/java/com/armsone/stand/audio/MateMonitoringService.kt, app/src/main/java/com/armsone/stand/StandViewModel.kt, app/src/main/java/com/armsone/stand/recording/RecordingSessionStore.kt]
        tests: [app/src/test/java/com/armsone/stand/model/StandBackgroundLifecyclePolicyTest.kt, app/src/test/java/com/armsone/stand/model/MateMonitoringStatusPolicyTest.kt, app/src/test/java/com/armsone/stand/recording/RecordingSessionStoreTest.kt]
        evidence: [.parity/evidence/2026-08-30/mate-overnight-device-trace.md]
    dependencies: [AVAudioSession, Android foreground service, microphone permission]
    parity_row_ids: [mate_mode.overnight_reliability_and_status]
  - id: home.brand_update_check
    purpose: 사용자가 설치된 앱의 최신 여부를 확인하고 직접 배포 대상에서는 자동 또는 수동으로 안전하게 다운로드한다.
    source_refs:
      - STand/UI/RootView.swift
      - STand/Services/MacUpdaterController.swift
    entry_points: [홈 > S.tand 로고, 설정 > 업데이트 자동 다운로드, 설정 > 업데이트 확인]
    preconditions: [인터넷에 연결되어 있음]
    inputs: [로고 선택]
    normal_result: 확인 중 상태 뒤 최신, 새 버전, 또는 다시 시도할 수 있는 오류 안내를 표시한다.
    states: [idle, checking, latest, update_available, downloading, cancelled, ready, failed]
    algorithms_and_thresholds:
      - 숫자 빌드 번호만 비교하며 원격 빌드가 현재 빌드보다 클 때만 새 버전으로 판정한다.
      - Android는 공식 최신 정식 release와 정확한 repo/tag/host/path/size/sha256/package/signing certificate를 모두 검증한다.
      - Android 자동 다운로드는 무과금 네트워크에서만 시작한다.
    data_contracts:
      - Apple 모바일은 NasFinder TestFlight 빌드 API의 stand 항목을 사용한다.
      - Mac은 기존 Sparkle 앱캐스트와 자동 다운로드 환경설정을 사용한다.
      - Android는 GitHub Releases의 최신 릴리스와 sha256 digest가 있는 허용 APK 자산을 사용한다.
      - 직접 배포 제품 버전은 2.2.1, Apple 내부 빌드는 342257, 공통 BuildStamp는 202608261617이다.
    producer_consumer_routes: [공개 릴리스 정보 > 버전 비교 > 홈 안내]
    persistence_relaunch: 확인 결과는 저장하지 않으며 업데이트 자동 다운로드 선택은 기본 켬으로 저장한다.
    permissions_privacy_security: [버전 확인 외 개인정보를 전송하지 않는다.]
    background_lifecycle: 화면을 떠나면 진행 중인 모바일 요청을 취소한다.
    gestures_accessibility:
      - 로고의 접근성 이름은 최신 버전 확인이다.
      - Google TV에서는 D-pad 포커스와 선택으로 실행한다.
    supported_devices_layouts: [iPhone, iPad, Mac, Android phone, Android tablet, Google TV]
    visual_reference: .parity/evidence/2026-08-25/google-tv-logo-update-latest.png
    platform_adaptations:
      apple: [iPhone과 iPad는 TestFlight를 열며 직접 다운로드는 제공하지 않고, Mac은 Sparkle 확인과 자동 다운로드 설정을 제공한다.]
      android: [DownloadManager 진행·취소·재시도 뒤 SHA-256·패키지·서명을 검증하고 시스템 설치자를 연다.]
    intentional_differences:
      - platform: all
        device_layout: all
        contract_field: update_distribution
        reason: 플랫폼별 공식 배포 경로가 다르다.
        closest_equivalent: 같은 로고 조작과 같은 네 가지 결과 상태를 제공한다.
        review_trigger: 배포 경로가 변경될 때
    implementations:
      apple:
        status: implemented_source_only
        source_refs: [STand/UI/RootView.swift, STand/Services/MacUpdaterController.swift]
        tests: [STandTests/MacUpdaterControllerTests.swift]
        evidence: [199 unit tests passed, STand UI catalog passed, 자동 다운로드 변경은 source only이며 재검증 대기]
      android:
        status: implemented_source_only
        source_refs:
          - app/src/main/java/com/armsone/stand/ui/StandHomeScreen.kt
          - app/src/main/java/com/armsone/stand/update/GitHubAppUpdateService.kt
        tests:
          - app/src/test/java/com/armsone/stand/update/GitHubUpdatePolicyTest.kt
          - app/src/androidTest/java/com/armsone/stand/ui/AppUpdateDialogTest.kt
        evidence:
          - .parity/evidence/2026-08-25/logo-update-check-behavior-trace.md
          - .parity/evidence/2026-08-25/google-tv-logo-update-latest.png
          - 자동·수동 다운로드와 검증 상태는 source only이며 빌드·실행·캡처 대기
    dependencies: [NasFinder TestFlight API, Sparkle appcast, GitHub Releases API]
    parity_row_ids: [home.brand_update_check]
  - id: settings.music.six_slot_management
    purpose: 사용자가 홈의 여섯 음악 채널을 한 목록에서 재생·수정·정렬한다.
    source_refs:
      - STand/UI/SettingsView.swift
      - STand/Models/AppSettings.swift
    entry_points: [설정 > 인터넷 라디오 바로가기, 설정 > 음악]
    preconditions: [앱 설정 화면을 열 수 있음]
    inputs: [음악 서비스 선택, 라디오 재생, 라디오 수정, 순서 변경]
    normal_result: 상단 바로가기가 음악 카드로 이동하며, 여섯 행의 순서와 상태가 홈 음악 스트립에 그대로 반영되고 재실행 뒤에도 유지된다.
    states: [idle, playing, loading, reconnecting, failed, empty]
    algorithms_and_thresholds:
      - 음악 서비스 2개와 인터넷 라디오 슬롯 4개를 합쳐 항상 6개 행으로 정규화한다.
      - 이미 배치된 행을 다른 위치로 옮기면 두 위치를 교환한다.
    data_contracts:
      - homeMusicChannels는 고유한 음악 서비스와 안정적인 radioSlot을 가진다.
    producer_consumer_routes:
      - 설정 음악 목록 > AppSettings.homeMusicChannels > 홈 음악 스트립
    persistence_relaunch: 저장소에 채널 순서를 기록하고 재실행 때 정규화해 복원한다.
    permissions_privacy_security:
      - 라디오 주소는 사용자가 직접 입력하며 앱이 웹페이지에서 자동 추출하지 않는다.
    background_lifecycle: 외부 음악 또는 라디오 재생 중에는 소리 감지와 녹음을 잠시 멈춘다.
    gestures_accessibility:
      - 터치 환경에서는 행의 순서 손잡이를 사용한다.
      - 키보드와 TV 리모컨에서는 순서 손잡이 선택 후 위·아래 버튼으로 이동한다.
    supported_devices_layouts: [iPhone, iPad, Mac, Android phone, Android tablet, Google TV]
    visual_reference: /Users/armsone/Library/Containers/cc.ffitch.shottr/Data/tmp/cc.ffitch.shottr/SCR-20260825-iqvy.png
    platform_adaptations:
      apple:
        - Apple Music과 Apple Music Classical을 기본 음악 서비스로 사용한다.
      android:
        - Spotify와 YouTube Music을 기본 음악 서비스로 사용한다.
        - D-pad에서 손잡이를 선택하면 명시적인 위·아래·완료 조작을 표시한다.
    intentional_differences:
      - platform: android
        device_layout: all
        contract_field: service_identity
        reason: Apple MusicKit 서비스 대신 Android에서 실제로 열 수 있는 Spotify와 YouTube Music을 사용한다.
        closest_equivalent: 음악 서비스 두 개와 라디오 네 개로 같은 여섯 슬롯 결과를 제공한다.
        review_trigger: Android에서 Apple Music 직접 재생 계약을 공식 지원할 때
    implementations:
      apple:
        status: implemented
        source_refs: [STand/UI/SettingsView.swift]
        tests: []
        evidence:
          - SCR-20260825-iqvy.png sha256:1c8c0a52b14d867fde1b690ca408e140f61549100323d8e896de5fef52e47f29
      android:
        status: implemented
        source_refs:
          - app/src/main/java/com/armsone/stand/ui/SettingsScreen.kt
          - app/src/main/java/com/armsone/stand/model/ExternalMusicService.kt
        tests: [app/src/test/java/com/armsone/stand/model/HomeMusicChannelPolicyTest.kt]
        evidence:
          - .parity/evidence/2026-08-25/google-tv-settings-music.png
    dependencies: [AppSettings.homeMusicChannels, InternetRadioState, ExternalMusicService]
    parity_row_ids: [settings.music.six_slot_management]
  - id: settings.layout.responsive_independent_columns
    purpose: 서로 높이가 다른 설정 카드가 가로·태블릿·TV 화면에서 큰 빈칸 없이 읽기 순서대로 흐른다.
    source_refs:
      - STand/UI/SettingsView.swift
    entry_points: [설정]
    preconditions: [넓은 화면 또는 가로 화면]
    inputs: [창 크기, 기기 방향]
    normal_result: 좁은 화면은 한 열, 720dp 이상은 독립적인 두 열이며 음악 카드는 전체 폭을 사용한다.
    states: [narrow, wide]
    algorithms_and_thresholds: [Android의 넓은 화면 기준은 720dp이다.]
    data_contracts: []
    producer_consumer_routes: [창 너비 > 설정 카드 배치]
    persistence_relaunch: 배치는 창 크기로 다시 계산하며 설정 상태는 유지한다.
    permissions_privacy_security: []
    background_lifecycle: 해당 없음
    gestures_accessibility: D-pad 포커스는 화면에 보이는 카드와 조작 순서를 따라 이동한다.
    supported_devices_layouts: [portrait phone, landscape phone, tablet, Google TV]
    visual_reference: settings music landscape captures
    platform_adaptations:
      apple: [명시적인 두 개의 독립 VStack을 사용한다.]
      android: [LazyVerticalStaggeredGrid의 독립 lane과 MUSIC FullLine을 사용한다.]
    intentional_differences: []
    implementations:
      apple:
        status: implemented
        source_refs: [STand/UI/SettingsView.swift]
        tests: []
        evidence: []
      android:
        status: implemented
        source_refs: [app/src/main/java/com/armsone/stand/ui/SettingsScreen.kt]
        tests: [assembleDebug]
        evidence: [.parity/evidence/2026-08-25/google-tv-settings-music.png]
    dependencies: [SettingsInformationArchitecture.CardOrder]
    parity_row_ids: [settings.responsive_panel_layout.parity]
  - id: home.edit_mode.stationary_long_press_entry
    purpose: 사용자가 홈 화면을 움직이지 않고 2초 동안 누르면 화면 편집 모드에 들어가고, 밝기·음량 조절 이동은 편집 진입을 취소한다.
    source_refs:
      - STand/UI/RootView.swift
    entry_points: [홈 > 빈 화면 길게 누르기, 홈 접근성 동작 > 화면 편집 열기]
    preconditions: [홈 화면이 보이고 편집 모드·시트·첫 실행 권한 안내가 열려 있지 않음]
    inputs: [정지 상태 2초 누름, 세로 드래그, 가로 드래그, 손 떼기, 추가 터치]
    normal_result: 정지 상태로 2.0초를 계속 누른 뒤에만 편집 모드가 열리고, 그보다 일찍 열리지 않는다.
    states: [pending, cancelled, entered]
    algorithms_and_thresholds:
      - 편집 진입 기준 시간은 2000ms이며 누름 시작 후 연속 정지 시간으로만 센다.
      - 누름 시작점 기준 허용 이동량(Apple 12pt, Android는 기존 터치 슬롭)을 초과하는 어느 방향 이동이든 그 제스처의 편집 진입을 영구히 취소한다.
      - 세로 밝기 조절과 가로 음량 조절로 인식된 이동은 손가락이 2초를 넘겨 계속 닿아 있어도 편집 모드를 열지 않는다.
      - 2초 전에 손을 떼거나 시스템이 취소하거나 손가락이 더 닿으면 편집 모드를 열지 않는다.
    data_contracts: []
    producer_consumer_routes: [누름·이동 이벤트 > 편집 진입 대기 상태 > 화면 편집기]
    persistence_relaunch: 진입 대기 상태는 제스처 단위로만 존재하며 저장하지 않는다.
    permissions_privacy_security: []
    background_lifecycle: 제스처 도중 시트나 첫 실행 안내가 열리면 편집 진입을 무시한다.
    gestures_accessibility:
      - 한 번 탭, 두 번 탭, 세로 밝기, 가로 음량, 핀치 시계 크기 조절은 기존 동작을 유지한다.
      - 보조 기술에서는 홈 화면 제어 요소의 화면 편집 열기 동작으로 누름 없이 진입한다.
    supported_devices_layouts: [iPhone portrait, iPhone landscape, iPad, Mac, Android phone, Android tablet]
    visual_reference: none
    platform_adaptations:
      apple:
        - LongPressGesture(minimumDuration 2.0, maximumDistance 12)를 밝기·음량 DragGesture 뒤에 exclusively로 두고, 드래그 시작 시 HomeEditEntryPolicy.PendingEntry를 취소한다.
        - Mac Catalyst는 가로 드래그를 음량 대신 무시 상태로 두지만 편집 취소 규칙은 동일하다.
      android:
        - StandPolicies의 동일 기준을 StandHomeScreen의 포인터 입력 처리에 적용한다.
    intentional_differences:
      - platform: all
        device_layout: all
        contract_field: movement_threshold
        reason: 이동 허용량은 각 플랫폼의 기존 시스템 기준(Apple 12pt, Android 터치 슬롭)을 그대로 쓴다.
        closest_equivalent: 두 플랫폼 모두 기준 초과 이동 시 그 제스처의 편집 진입을 영구 취소한다.
        review_trigger: 어느 플랫폼이든 허용 이동량을 바꿀 때
    implementations:
      apple:
        status: implemented_source_only
        source_refs: [STand/UI/RootView.swift]
        tests: [STandTests/AudioAnalysisTests.swift]
        evidence: [uncompiled draft, 런타임·시각 검증 미실시]
      android:
        status: implemented_source_only
        source_refs:
          - app/src/main/java/com/armsone/stand/ui/StandHomeScreen.kt
          - app/src/main/java/com/armsone/stand/model/StandPolicies.kt
        tests: [app/src/test/java/com/armsone/stand/model/StandPoliciesTest.kt]
        evidence: [source only]
    dependencies: [HomeEditEntryPolicy, ScreenEditorView, StandPolicies]
    parity_row_ids: [home.edit_mode.stationary_long_press_entry]
